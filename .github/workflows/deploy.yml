name: Deploy

# Deploys one already-published app release to one environment.
# Called by release-app.yml, or run manually to redeploy or roll back.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      app:
        description: Application name (directory under apps/)
        required: true
        type: string
      release:
        required: true
        type: string
      digest:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options: [dev, production]
      app:
        description: Application to deploy
        required: true
        type: choice
        options: [helgefolelse]
      release:
        description: Commit SHA or release tag (for example helgefolelse@v2026.10.3) to deploy or roll back to
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read # Verify image provenance.
      contents: read # Check out smoke tests.
      packages: write # Pull the image and move its environment tag.
      id-token: write # Authenticate to GCP with Workload Identity Federation.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.promote.outputs.url }}
    concurrency:
      # Per app, so one app's pending deploy never cancels or blocks another's.
      group: deploy-${{ inputs.app }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      APP: ${{ inputs.app }}
      SERVICE: ${{ inputs.app }}-web
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-north2
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: europe-north2
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Validate app name
        run: '[[ "$APP" =~ ^[a-z][a-z0-9-]{1,20}[a-z0-9]$ ]] || { echo "::error::Invalid app: $APP"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/${{ inputs.app }}/tests
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]*$ ]] || { echo "::error::Invalid release: $RELEASE"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$SERVICE"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" --jq .sha)"
          ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)"
          if [[ "$ancestry" != ahead && "$ancestry" != identical ]]; then
            echo "::error::Release commit $sha is not an ancestor of current main" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_DIGEST" ]]; then
            [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid image digest"; exit 1; }
            digest="$EXPECTED_DIGEST"
          else
            digest="$(docker buildx imagetools inspect "$image:$sha" --format '{{ .Manifest.Digest }}')"
          fi
          # Only images built and attested by CI on main are deployable. ci-cd.yml signed
          # releases made before the monorepo split; drop it once those are too old to roll back to.
          verified=false
          for signer in release-app.yml ci-cd.yml; do
            if gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/$signer" \
              --source-ref refs/heads/main --deny-self-hosted-runners; then
              verified=true
              break
            fi
          done
          [[ "$verified" == true ]] || { echo "::error::No valid provenance for $image@$digest" >&2; exit 1; }
          revision="$(docker buildx imagetools inspect "$image@$digest" --format '{{ json .Image }}' |
            jq -er 'if has("config") then . else .["linux/amd64"] end |
              .config.Labels["org.opencontainers.image.revision"]')"
          if [[ "$revision" != "$sha" ]]; then
            echo "::error::Image revision $revision does not match requested commit $sha" >&2
            exit 1
          fi
          printf 'sha=%s\nimage=%s@%s\n' "$sha" "$image" "$digest" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-north2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Mirror image to Artifact Registry
        id: mirror
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          command -v skopeo > /dev/null || { sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo; }
          target="$REGION-docker.pkg.dev/$PROJECT_ID/$APP/web"
          # --preserve-digests fails rather than rewriting manifests, so Cloud Run runs the attested digest.
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "docker://$IMAGE" "docker://$target:$SHA"
          echo "image=$target@${IMAGE#*@}" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate without traffic
        id: candidate
        env:
          IMAGE: ${{ steps.mirror.outputs.image }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --no-traffic --tag candidate \
            --update-env-vars "GIT_SHA=$SHA"
          gcloud run services describe "$SERVICE" --format=json |
            jq -er '.status.traffic[] | select(.tag == "candidate") |
              "url=\(.url)\nrevision=\(.revisionName)"' >> "$GITHUB_OUTPUT"

      - name: Smoke test candidate
        env:
          SMOKE_URL: ${{ steps.candidate.outputs.url }}
          SHA: ${{ steps.release.outputs.sha }}
        run: node --test "apps/$APP/tests/smoke.mjs"

      - name: Promote candidate
        id: promote
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --to-revisions "$REVISION=100"
          echo "url=$(gcloud run services describe "$SERVICE" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Tag image with environment
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: docker buildx imagetools create --tag "${IMAGE%@*}:$ENVIRONMENT" "$IMAGE"
