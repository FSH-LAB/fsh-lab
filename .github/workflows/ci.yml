name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      code-quality: write # Upload code coverage report.
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - uses: ./.github/actions/setup-workspace # zizmor: ignore[self-repository]
        with:
          install: "true"
      - run: pnpm format:check
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm lint:workflows
      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          version: v0.74.0
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate infrastructure without cloud credentials
        run: |
          terraform fmt -check -recursive infra
          for root in infra infra/github; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=infra test
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          persona: auditor
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
      - name: Lint, typecheck and build
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run lint typecheck build --affected
          else
            pnpm turbo run lint typecheck build
          fi
      - name: Run test suite with coverage
        run: pnpm test:coverage
      - name: Upload code coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
      - name: Detect affected apps
        id: affected
        run: |
          AFFECTED=$(CI=1 pnpm turbo ls --affected --output=json | jq -c '[.packages.items[] | select(.path | startswith("apps/")) | .name]')
          echo "Discovered affected apps: $AFFECTED"
          echo "apps=$AFFECTED" >> "$GITHUB_OUTPUT"

  image:
    name: Verify image (${{ matrix.app }})
    needs: verify
    if: contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && needs.verify.outputs.apps != '[]' && needs.verify.outputs.apps != ''
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJson(needs.verify.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve Dockerfile
        id: dockerfile
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ -f "apps/$APP/Dockerfile" ]; then
            echo "file=apps/$APP/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=Dockerfile" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          build-args: |
            APP_NAME=${{ matrix.app }}
          load: true
          tags: ${{ matrix.app }}-web:ci
          cache-from: type=gha,scope=${{ matrix.app }}-web
      - name: Smoke test image
        env:
          APP: ${{ matrix.app }}
        run: |
          docker run --detach --name web --publish 8080:8080 \
            --env GIT_SHA="$GITHUB_SHA" "${APP}-web:ci"
          if ! SHA="$GITHUB_SHA" SMOKE_URL=http://localhost:8080 node --test "apps/$APP/tests/smoke.mjs"; then
            docker logs web
            exit 1
          fi
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.app }}-web:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
