name: CI

# Single pipeline for every change:
#   verify (code | workflows | infra | images)  ->  CI gate  ->  [main only] infra apply  ->  per-app delivery (cd.yml)
# Branch protection only needs to require the "CI" gate; new jobs and apps never require ruleset changes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    name: Verify Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      code-quality: write # Upload code coverage report.
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - uses: ./.github/actions/setup-workspace
        with:
          install: "true"
      - run: pnpm format:check
      - name: Lint, typecheck, test and build
        run: |
          [ "$GITHUB_EVENT_NAME" = pull_request ] && export TURBO_SCM_BASE="origin/$GITHUB_BASE_REF" && set -- --affected
          pnpm turbo run lint typecheck test build "$@"
      - name: Run end-to-end tests
        if: github.event_name != 'push'
        run: |
          [ "$GITHUB_EVENT_NAME" = pull_request ] && export TURBO_SCM_BASE="origin/$GITHUB_BASE_REF" && set -- --affected
          if [ "$(pnpm turbo run test:e2e "$@" --dry=json | jq '.tasks | length')" -gt 0 ]; then
            pnpm exec playwright install --with-deps chromium
            pnpm turbo run test:e2e "$@"
          fi
      - run: pnpm test:coverage
      - name: Upload code coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
      - name: Detect changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="${BASE_REF:+origin/$BASE_REF}"
          base="${base:-${BEFORE:-HEAD^}}"
          [[ "$base" =~ ^0+$ ]] && base="HEAD^"
          export TURBO_SCM_BASE="$base"
          apps="$(pnpm turbo ls --affected --output=json | jq -c '[.packages.items[] | select(.path | startswith("apps/")) | .name]')"
          if ! git diff --quiet "$base"...HEAD -- Dockerfile .dockerignore .github/actions/build-image; then
            for dir in apps/*/; do
              app="${dir#apps/}"
              app="${app%/}"
              [ -f "${dir}Dockerfile" ] || apps="$(jq -cn --argjson a "$apps" --arg app "$app" '$a + [$app] | unique')"
            done
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base"...HEAD -- infra 'apps/*/infra.json' .github/workflows/infra.yml; then
            echo "infra=false" >> "$GITHUB_OUTPUT"
          else
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi

  workflows:
    name: Verify workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows with actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          persona: auditor
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml

  infra:
    name: Verify infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          version: v0.74.0
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate and test Terraform
        run: |
          terraform fmt -check -recursive infra
          for root in infra infra/github; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=infra test

  image:
    name: Verify image (${{ matrix.app }})
    needs: code
    if: github.event_name != 'push' && needs.code.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.code.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        id: image
        with:
          app: ${{ matrix.app }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Smoke test image
        env:
          APP: ${{ matrix.app }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker run --detach --name web --publish 8080:8080 --env GIT_SHA="$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"
          SHA="$GITHUB_SHA" SMOKE_URL=http://localhost:8080 node --test "apps/$APP/tests/smoke.mjs" || { docker logs web; exit 1; }

  ci:
    name: CI
    needs: [code, workflows, infra, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # ---------------------------------------------------------------------------
  # Delivery (push to main only):
  #   1. Apply dev infra + deploy affected apps to dev automatically
  #   2. Single manual approval gate (approve-production)
  #   3. Apply production infra + deploy affected apps to production
  # ---------------------------------------------------------------------------

  infra-dev:
    name: Infra (dev)
    needs: [code, ci]
    if: ${{ always() && !cancelled() && !failure() && needs.ci.result == 'success' && github.event_name == 'push' && needs.code.outputs.infra == 'true' }}
    uses: ./.github/workflows/infra.yml
    with:
      environment: dev
    permissions:
      contents: read # Check out infrastructure code.
      id-token: write # Authenticate to GCP using Workload Identity Federation.

  deploy-dev:
    name: Deliver dev (${{ matrix.app }})
    needs: [code, ci, infra-dev]
    if: ${{ always() && !cancelled() && !failure() && needs.ci.result == 'success' && (needs.code.outputs.infra != 'true' || needs.infra-dev.result == 'success') && github.event_name == 'push' && needs.code.outputs.apps != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.code.outputs.apps) }}
    uses: ./.github/workflows/cd.yml
    with:
      app: ${{ matrix.app }}
      environment: dev
    permissions:
      attestations: write # Sign build provenance.
      contents: write # Required by cd.yml workflow_call permission ceiling.
      id-token: write # Authenticate to GCP and sign provenance.
      packages: write # Publish container images to GHCR.

  approve-production:
    name: Approve production
    needs: [code, ci, infra-dev, deploy-dev]
    if: ${{ always() && !cancelled() && !failure() && needs.ci.result == 'success' && github.event_name == 'push' && (needs.code.outputs.infra == 'true' || needs.code.outputs.apps != '[]') && (needs.code.outputs.infra != 'true' || needs.infra-dev.result == 'success') && (needs.code.outputs.apps == '[]' || needs.deploy-dev.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-approval
    steps:
      - name: Production rollout approved
        env:
          INFRA: ${{ needs.code.outputs.infra }}
          APPS: ${{ needs.code.outputs.apps }}
        run: echo "Approved production rollout (infra=$INFRA, apps=$APPS)"

  infra-production:
    name: Infra (production)
    needs: [code, approve-production]
    if: ${{ always() && !cancelled() && !failure() && needs.approve-production.result == 'success' && github.event_name == 'push' && needs.code.outputs.infra == 'true' }}
    uses: ./.github/workflows/infra.yml
    with:
      environment: production
    permissions:
      contents: read # Check out infrastructure code.
      id-token: write # Authenticate to GCP using Workload Identity Federation.

  deploy-production:
    name: Deliver production (${{ matrix.app }})
    needs: [code, approve-production, infra-production]
    if: ${{ always() && !cancelled() && !failure() && needs.approve-production.result == 'success' && (needs.code.outputs.infra != 'true' || needs.infra-production.result == 'success') && github.event_name == 'push' && needs.code.outputs.apps != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.code.outputs.apps) }}
    uses: ./.github/workflows/cd.yml
    with:
      app: ${{ matrix.app }}
      environment: production
    permissions:
      attestations: write # Required by cd.yml workflow_call permission ceiling.
      contents: write # Create GitHub releases.
      id-token: write # Authenticate to GCP using Workload Identity Federation.
      packages: write # Required by cd.yml workflow_call permission ceiling.
