name: Infrastructure

# Applies Terraform to one environment. Called by ci.yml (dev, then production) when infra changes
# land on main; validation runs in ci.yml. Dispatch manually to re-apply an environment.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [dev, production]

permissions:
  contents: read

jobs:
  apply:
    name: Apply ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: infra-apply-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read # Check out infrastructure code.
      id-token: write # Authenticate to GCP using Workload Identity Federation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Terraform apply
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=$PROJECT_ID-terraform-state" \
            -backend-config="prefix=helgefolelse/$ENVIRONMENT"
          terraform -chdir=infra apply -input=false -auto-approve -lock-timeout=5m \
            -var-file="environments/$ENVIRONMENT.tfvars"
