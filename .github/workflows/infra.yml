name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "apps/**/infra.json"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "apps/**/infra.json"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [dev, production, all]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate infrastructure
        run: |
          terraform fmt -check -recursive infra
          for root in infra infra/github; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=infra test

  apply-dev:
    name: Apply dev
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.environment == 'dev' || inputs.environment == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: infra-apply-dev
      cancel-in-progress: false
    permissions:
      contents: read # Check out infrastructure code.
      id-token: write # Authenticate to GCP using Workload Identity Federation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Apply dev infrastructure
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=$PROJECT_ID-terraform-state" \
            -backend-config="prefix=fsh-lab/dev"
          terraform -chdir=infra apply -input=false -auto-approve -lock-timeout=5m \
            -var-file="environments/dev.tfvars"

  apply-production:
    name: Apply production
    needs: [validate, apply-dev]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.environment == 'production' || inputs.environment == 'all')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: infra-apply-production
      cancel-in-progress: false
    permissions:
      contents: read # Check out infrastructure code.
      id-token: write # Authenticate to GCP using Workload Identity Federation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Apply production infrastructure
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=$PROJECT_ID-terraform-state" \
            -backend-config="prefix=fsh-lab/production"
          terraform -chdir=infra apply -input=false -auto-approve -lock-timeout=5m \
            -var-file="environments/production.tfvars"
