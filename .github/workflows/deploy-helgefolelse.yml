name: Release helgefolelse

on:
  push:
    branches: [main]
    paths:
      - "apps/helgefolelse/**"
      - "packages/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/release-app.yml"
      - ".github/workflows/deploy-helgefolelse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-helgefolelse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write # Create release tags and check out code.
      packages: write # Publish container images to GHCR.
      attestations: write # Publish and verify build provenance.
      id-token: write # Authenticate to GCP and sign provenance.
    uses: ./.github/workflows/release-app.yml # zizmor: ignore[self-repository]
    with:
      app: helgefolelse
