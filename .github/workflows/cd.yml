name: CD

# Orchestrates multi-app continuous delivery to Google Cloud Run.
# Dynamically discovers affected applications under apps/* via Turborepo and
# runs pipeline stages (publish -> deploy-dev -> deploy-production) across a GitHub Actions matrix.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "Dockerfile"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/cd.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      app:
        description: Specific application to deploy (leave blank to deploy all affected)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cd-orchestrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-apps:
    name: Detect affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace # zizmor: ignore[self-repository]
        with:
          install: "true"
      - name: Find affected apps
        id: filter
        env:
          MANUAL_APP: ${{ inputs.app }}
        run: |
          if [ -n "$MANUAL_APP" ]; then
            [[ "$MANUAL_APP" =~ ^[a-z][a-z0-9-]{1,20}[a-z0-9]$ ]] || { echo "::error::Invalid app: $MANUAL_APP"; exit 1; }
            [ -d "apps/$MANUAL_APP" ] || { echo "::error::App directory apps/$MANUAL_APP not found"; exit 1; }
            echo "Manual app specified: $MANUAL_APP"
            echo "apps=[\"$MANUAL_APP\"]" >> "$GITHUB_OUTPUT"
          else
            AFFECTED=$(CI=1 pnpm turbo ls --affected --output=json | jq -c '[.packages.items[] | select(.path | startswith("apps/")) | .name]')
            echo "Discovered affected apps: $AFFECTED"
            echo "apps=$AFFECTED" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish image (${{ matrix.app }})
    needs: detect-apps
    if: ${{ needs.detect-apps.outputs.apps != '[]' && needs.detect-apps.outputs.apps != '' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Validate app name
        env:
          APP: ${{ matrix.app }}
        run: '[[ "$APP" =~ ^[a-z][a-z0-9-]{1,20}[a-z0-9]$ ]] || { echo "::error::Invalid app: $APP"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image name
        id: image
        env:
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$APP-web" >> "$GITHUB_OUTPUT"
      - name: Resolve Dockerfile
        id: dockerfile
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ -f "apps/$APP/Dockerfile" ]; then
            echo "file=apps/$APP/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=Dockerfile" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          build-args: |
            APP_NAME=${{ matrix.app }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}-web
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-web
          sbom: true
          provenance: mode=max
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}

  deploy-dev:
    name: Deploy dev (${{ matrix.app }})
    needs: [detect-apps, publish]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
      id-token: write
    environment:
      name: dev
      url: ${{ steps.rollout.outputs.url }}
    concurrency:
      group: deploy-${{ matrix.app }}-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Await infrastructure provisioning (dev)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          run_id="$(gh run list --workflow=infra.yml --commit="$COMMIT_SHA" --status=in_progress --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            run_id="$(gh run list --workflow=infra.yml --commit="$COMMIT_SHA" --status=queued --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          fi
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            echo "Waiting for active infrastructure workflow run $run_id..."
            gh run watch "$run_id" --exit-status || { echo "::error::Infrastructure provisioning failed"; exit 1; }
          fi
      - uses: ./.github/actions/cloud-run-rollout # zizmor: ignore[self-repository]
        id: rollout
        with:
          app: ${{ matrix.app }}
          environment: dev
          release: ${{ github.sha }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_deploy_service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

  deploy-production:
    name: Deploy production (${{ matrix.app }})
    needs: [detect-apps, deploy-dev]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: write
      packages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.rollout.outputs.url }}
    concurrency:
      group: deploy-${{ matrix.app }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloud-run-rollout # zizmor: ignore[self-repository]
        id: rollout
        with:
          app: ${{ matrix.app }}
          environment: production
          release: ${{ github.sha }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_deploy_service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: |
          tag="$APP@v$(date -u +%Y.%-m).$GITHUB_RUN_NUMBER"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
