name: CD

# Delivers one app to Google Cloud Run: publish attested image -> deploy dev -> deploy production.
# Called by ci.yml (one call per affected app) after verification passes on main.
# Dispatch manually to rebuild and redeploy an app from main; use rollback.yml for an existing release.

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app:
        description: Application to build and deploy from main
        required: true
        type: string

permissions:
  contents: read

# Serialize per app so an older commit can never be promoted after a newer one.
concurrency:
  group: cd-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Publish container images to GHCR.
      attestations: write # Publish build provenance attestations.
      id-token: write # Sign provenance attestations.
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-image
        id: image
        with:
          app: ${{ inputs.app }}
          push: "true"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}

  deploy-dev:
    name: Deploy dev
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read # Verify image build provenance.
      contents: read
      packages: write # Move environment tag in GHCR.
      id-token: write # Authenticate to GCP using Workload Identity Federation.
    environment:
      name: dev
      url: ${{ steps.rollout.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.app }}-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloud-run-rollout
        id: rollout
        with:
          app: ${{ inputs.app }}
          environment: dev
          release: ${{ github.sha }}
          digest: ${{ needs.publish.outputs.digest }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_deploy_service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

  deploy-production:
    name: Deploy production
    needs: [publish, deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read # Verify image build provenance.
      contents: write # Create GitHub releases.
      packages: write # Move environment tag in GHCR.
      id-token: write # Authenticate to GCP using Workload Identity Federation.
    environment:
      name: production
      url: ${{ steps.rollout.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.app }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloud-run-rollout
        id: rollout
        with:
          app: ${{ inputs.app }}
          environment: production
          release: ${{ github.sha }}
          digest: ${{ needs.publish.outputs.digest }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_deploy_service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ inputs.app }}
        run: |
          tag="$APP@v$(date -u +%Y.%-m).$GITHUB_RUN_NUMBER"
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
