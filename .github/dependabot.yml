version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/"
      - "/apps/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - "/infra"
      - "/infra/github"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns:
          - "*"
