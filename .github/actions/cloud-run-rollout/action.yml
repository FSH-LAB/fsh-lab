name: "Cloud Run Rollout"
description: "Deploys an attested image to Google Cloud Run with zero-traffic candidate verification, smoke testing, and 100% traffic promotion"

inputs:
  app:
    description: "Application name (directory under apps/)"
    required: true
  environment:
    description: "Target deployment environment (dev or production)"
    required: true
  release:
    description: "Commit SHA or release tag (e.g. helgefolelse@v2026.10.3) to deploy or roll back to"
    required: true
  digest:
    description: "Image digest (sha256:...) if already known"
    required: false
    default: ""
  gcp_project_id:
    description: "GCP Project ID"
    required: true
  gcp_wif_provider:
    description: "GCP Workload Identity Federation provider"
    required: true
  gcp_deploy_service_account:
    description: "GCP Service Account for deployment"
    required: true
  region:
    description: "Google Cloud Region"
    required: false
    default: "europe-north2"
  github_token:
    description: "GitHub token for GHCR authentication and GitHub CLI operations"
    required: false
    default: ${{ github.token }}

outputs:
  url:
    description: "Promoted Cloud Run service URL"
    value: ${{ steps.promote.outputs.url }}
  revision:
    description: "Promoted Cloud Run revision name"
    value: ${{ steps.candidate.outputs.revision }}
  sha:
    description: "Resolved commit SHA"
    value: ${{ steps.release.outputs.sha }}
  image:
    description: "Resolved image reference with digest"
    value: ${{ steps.release.outputs.image }}

runs:
  using: composite
  steps:
    - name: Validate app name
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: '[[ "$APP" =~ ^[a-z][a-z0-9-]{1,20}[a-z0-9]$ ]] || { echo "::error::Invalid app: $APP"; exit 1; }'

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Resolve and verify release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RELEASE: ${{ inputs.release }}
        EXPECTED_DIGEST: ${{ inputs.digest }}
        SERVICE: ${{ inputs.app }}-web
      run: |
        [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]*$ ]] || { echo "::error::Invalid release: $RELEASE"; exit 1; }
        image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$SERVICE"
        sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" --jq .sha)"
        ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)"
        if [[ "$ancestry" != ahead && "$ancestry" != identical ]]; then
          echo "::error::Release commit $sha is not an ancestor of current main" >&2
          exit 1
        fi
        if [[ -n "$EXPECTED_DIGEST" ]]; then
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid image digest"; exit 1; }
          digest="$EXPECTED_DIGEST"
        else
          digest="$(docker buildx imagetools inspect "$image:$sha" --format '{{ .Manifest.Digest }}')"
        fi
        # Only images built and attested by CI on main are deployable.
        # cd.yml signs current builds. _cd-app.yml, _deploy-app.yml, release-app.yml, and
        # ci-cd.yml signed historical releases; retain them to allow rollbacks to prior versions.
        verified=false
        for signer in cd.yml _cd-app.yml _deploy-app.yml release-app.yml ci-cd.yml; do
          if gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/$signer" \
            --source-ref refs/heads/main --deny-self-hosted-runners; then
            verified=true
            break
          fi
        done
        [[ "$verified" == true ]] || { echo "::error::No valid provenance for $image@$digest" >&2; exit 1; }
        revision="$(docker buildx imagetools inspect "$image@$digest" --format '{{ json .Image }}' |
          jq -er 'if has("config") then . else .["linux/amd64"] end |
            .config.Labels["org.opencontainers.image.revision"]')"
        if [[ "$revision" != "$sha" ]]; then
          echo "::error::Image revision $revision does not match requested commit $sha" >&2
          exit 1
        fi
        printf 'sha=%s\nimage=%s@%s\n' "$sha" "$image" "$digest" >> "$GITHUB_OUTPUT"

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      id: auth
      with:
        project_id: ${{ inputs.gcp_project_id }}
        workload_identity_provider: ${{ inputs.gcp_wif_provider }}
        service_account: ${{ inputs.gcp_deploy_service_account }}
        token_format: access_token

    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.region }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Mirror image to Artifact Registry
      id: mirror
      shell: bash
      env:
        IMAGE: ${{ steps.release.outputs.image }}
        SHA: ${{ steps.release.outputs.sha }}
        REGION: ${{ inputs.region }}
        PROJECT_ID: ${{ inputs.gcp_project_id }}
        APP: ${{ inputs.app }}
      run: |
        target="$REGION-docker.pkg.dev/$PROJECT_ID/$APP/web"
        docker buildx imagetools create --tag "$target:$SHA" "$IMAGE"
        echo "image=$target@${IMAGE#*@}" >> "$GITHUB_OUTPUT"

    - name: Deploy candidate without traffic
      id: candidate
      shell: bash
      env:
        SERVICE: ${{ inputs.app }}-web
        IMAGE: ${{ steps.mirror.outputs.image }}
        SHA: ${{ steps.release.outputs.sha }}
        CLOUDSDK_CORE_PROJECT: ${{ inputs.gcp_project_id }}
        CLOUDSDK_RUN_REGION: ${{ inputs.region }}
        CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        APP: ${{ inputs.app }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        env_vars="GIT_SHA=$SHA"
        manifest="apps/$APP/infra.json"
        if [ -f "$manifest" ]; then
          manifest_env=$(jq -r '.env // {} | to_entries[] | "\(.key)=\(.value)"' "$manifest" 2>/dev/null || true)
          for item in $manifest_env; do
            if [ -n "$item" ]; then
              env_vars="$env_vars,$item"
            fi
          done
        fi
        if [ "$APP" = "status" ]; then
          env_vars="$env_vars,GCP_PROJECT_ID=$CLOUDSDK_CORE_PROJECT"
          if [ "$ENVIRONMENT" != "production" ]; then
            helge_url="$(gcloud run services describe helgefolelse-web --format='value(status.url)' 2>/dev/null || true)"
            if [ -n "$helge_url" ]; then
              env_vars="$env_vars,HELGEFOLELSE_URL=$helge_url,HELGEFOLELSE_HEALTH_URL=$helge_url/api/health"
            fi
          fi
        fi
        gcloud run deploy "$SERVICE" --image "$IMAGE" --no-traffic --tag candidate \
          --update-env-vars "$env_vars"
        gcloud run services describe "$SERVICE" --format=json |
          jq -er '.status.traffic[] | select(.tag == "candidate") |
            "url=\(.url)\nrevision=\(.revisionName)"' >> "$GITHUB_OUTPUT"

    - name: Smoke test candidate
      shell: bash
      env:
        SMOKE_URL: ${{ steps.candidate.outputs.url }}
        SHA: ${{ steps.release.outputs.sha }}
        APP: ${{ inputs.app }}
      run: |
        if token="$(gcloud auth print-identity-token --audiences="$SMOKE_URL" 2>/dev/null)"; then
          export SMOKE_TOKEN="$token"
        fi
        node --test "apps/$APP/tests/smoke.mjs"

    - name: Promote candidate
      id: promote
      shell: bash
      env:
        SERVICE: ${{ inputs.app }}-web
        REVISION: ${{ steps.candidate.outputs.revision }}
        CLOUDSDK_CORE_PROJECT: ${{ inputs.gcp_project_id }}
        CLOUDSDK_RUN_REGION: ${{ inputs.region }}
        CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      run: |
        gcloud run services update-traffic "$SERVICE" --to-revisions "$REVISION=100"
        echo "url=$(gcloud run services describe "$SERVICE" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

    - name: Tag image with environment
      shell: bash
      env:
        IMAGE: ${{ steps.release.outputs.image }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: docker buildx imagetools create --tag "${IMAGE%@*}:$ENVIRONMENT" "$IMAGE"
