apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fsh-lab-gateway
  namespace: default
  labels:
    app.kubernetes.io/part-of: fsh-lab
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
