apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: helgefolelse-route
  namespace: helgefolelse
  labels:
    app.kubernetes.io/name: helgefolelse
spec:
  parentRefs:
    - name: fsh-lab-gateway
      namespace: default
  hostnames:
    - "helgefolelse.dev.fsh.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: helgefolelse-web
          port: 8080
