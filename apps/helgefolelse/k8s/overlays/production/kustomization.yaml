apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - httproute.yaml

patches:
  - target:
      kind: ServiceAccount
      name: helgefolelse-sa
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: helgefolelse-runtime@generated-mote-510411-v8.iam.gserviceaccount.com
  - target:
      kind: Deployment
      name: helgefolelse-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
