apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-route
  namespace: status
  labels:
    app.kubernetes.io/name: status
spec:
  parentRefs:
    - name: fsh-lab-gateway
      namespace: default
  hostnames:
    - "status.dev.fsh.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: status-web
          port: 8080
